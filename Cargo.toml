[package]
name = "ds4"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Managed DwarfStar inference plugin for Mesh LLM"
repository = "https://github.com/Mesh-LLM/ds4-plugin"

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "4ae1ace57dbbe28d0c3d10a05ee542328e8e64e7" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
